    <script>
      /* Runs before first paint so CSS and JS can both gate the expensive
         background effects on low-power devices.
         Touch-primary counts as lite on its own: a modern phone reports 8
         cores, so the core count alone does not catch it, and phone GPUs
         cannot sustain three 50px-blurred layers plus two canvas loops. */
      (function () {
        var lite = false;
        try {
          var c = navigator.connection || {};
          if (c.saveData) lite = true;
          if (/2g|3g/.test(c.effectiveType || '')) lite = true;
        } catch (e) {}
        var cores = navigator.hardwareConcurrency;
        if (cores && cores <= 4) lite = true;
        try {
          var mq = window.matchMedia.bind(window);
          if (mq('(prefers-reduced-motion: reduce)').matches) lite = true;
          if (mq('(hover: none) and (pointer: coarse)').matches) lite = true;
        } catch (e) {}
        document.documentElement.dataset.perf = lite ? 'lite' : 'full';
      })();
    </script>
